syntax = "proto3";

option go_package = "github.com/c12s/gprunner/cmd/api";
package runner_proto;

service RunnerService {
  rpc Pull(PullReq) returns (Empty) {}
  rpc Instantiate(InstantiateReq) returns (Empty) {}
  rpc Kill(ChartRef) returns (Empty) {}
}

message ChartRef {
  string name = 1;
  string namespace = 2;
  string maintainer = 3;
  string schemaVersion = 4;
}

// picks a layer version, both fields optional: an empty semver means latest,
// an empty arch the multi-platform index
message LayerSelector {
  string semver = 1;
  string arch = 2;
}

message InstantiateReq {
  ChartRef ref = 1;
  bool pull = 2;
  map<string, LayerSelector> layers = 3;
}

message PullReq {
  ChartRef ref = 1;
  map<string, LayerSelector> layers = 2;
}

message Empty {}