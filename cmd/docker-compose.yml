services:
  buildkitd:
    image: moby/buildkit:v0.29.0
    privileged: true
    volumes:
      # socket dir
      - buildkit-sock:/run/buildkit
      # layer cache
      - buildkit-cache:/var/lib/buildkit
    healthcheck:
      test: ["CMD", "buildctl", "debug", "workers"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  runner:
    build:
      context: ..
      dockerfile: cmd/Dockerfile
    depends_on:
      buildkitd:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      PGRUNNER_CACHE: ${PGRUNNER_CACHE}
      PGRUNNER_BROKER: ${PGRUNNER_BROKER}
      PGRUNNER_BROKER_SUBNET: ${PGRUNNER_BROKER_SUBNET}
      KRAFTKIT_BUILDKIT_HOST: ${KRAFTKIT_BUILDKIT_HOST}
      KRAFTKIT_NO_PROMPT: ${KRAFTKIT_NO_PROMPT}
      KRAFTKIT_LOG_TYPE: ${KRAFTKIT_LOG_TYPE}
      KRAFTKIT_NO_COLOR: ${KRAFTKIT_NO_COLOR}
      KRAFTKIT_NO_CHECK_UPDATES: ${KRAFTKIT_NO_CHECK_UPDATES}
    volumes:
      # image/build mount
      - ~/data:/app/data
      # socket access with read only options
      - buildkit-sock:/run/buildkit:ro
      # kraft package store
      - kraft-store:/root/.local/share/kraftkit
    # creating the broker bridge and attaching a tap per guest are both
    # privileged network operations; /dev/net/tun is what the tap is opened on
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/kvm
      - /dev/net/tun

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT}:4222"
      - "${NATS_MONITOR_PORT}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buildkit-sock:
  buildkit-cache:
  kraft-store:
  nats-data: